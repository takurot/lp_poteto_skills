name: test-and-deploy

# pull_request, never pull_request_target: fork PRs run without secrets and with a read-only token.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://poteto-skills.example.workers.dev
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Refuse the placeholder SITE_URL
        run: |
          case "$SITE_URL" in
            *.example.workers.dev) echo "::error::SITE_URL is still the placeholder $SITE_URL. Set the real workers.dev URL in deploy.yml."; exit 1 ;;
          esac
      - id: secrets
        name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured. See docs/deploy.md."
            echo "Deploy skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not configured (docs/deploy.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci
      - if: steps.secrets.outputs.configured == 'true'
        run: npm run build
      - if: steps.secrets.outputs.configured == 'true'
        name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          echo "Deployed $GITHUB_SHA to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

  preview:
    needs: test
    # Same-repository PRs only. Dependabot PRs are excluded so Cloudflare secrets never need to be Dependabot secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: secrets
        name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Preview skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured. See docs/deploy.md."
            echo "Preview skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not configured (docs/deploy.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci
      - if: steps.secrets.outputs.configured == 'true'
        run: npm run build
      - if: steps.secrets.outputs.configured == 'true'
        id: upload
        name: wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler versions upload --message "PR #$PR_NUMBER at $HEAD_SHA" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE 'Version Preview URL: https://[^[:space:]]+' "$RUNNER_TEMP/upload.log" | head -n 1 | cut -d' ' -f4)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.configured == 'true' && steps.upload.outputs.url == ''
        run: |
          echo "::warning title=No preview URL::wrangler versions upload printed no preview URL. Preview URLs may be disabled for the Worker."
          echo "Version uploaded, but wrangler printed no preview URL." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.upload.outputs.url != ''
        name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        # One comment per PR, found by its marker, so other bot comments are never overwritten.
        run: |
          marker="<!-- preview-url -->"
          body="$marker
          Preview for $HEAD_SHA: $PREVIEW_URL"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
